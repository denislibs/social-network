<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прототип ВКонтакте</title>
  <style>
    :root{color-scheme:light}
    html,body{margin:0}
    img{max-width:100%}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<style>
/* ======================================================================
   Токены VKUI (vkBase). Светлая — база, тёмная — оверрайд.
   ====================================================================== */
:root{
  color-scheme: light;
  --is-dark:0;
  --bg:#edeef0; --content:#ffffff; --secondary:#f0f2f5; --tertiary:#fafbfc;
  --modal:#ffffff; --header:#ffffff; --field:#ffffff; --searchfield:#edeef0;
  --acc:#447bba; --acc-h:#4177b5; --acc-a:#3f72b0; --on-acc:#ffffff;
  --neg:#e64646; --pos:#4bb34b;
  --neg-tint:#faebeb; --pos-tint:#e8f9e8; --warn-tint:#fff2d6; --info-tint:#deeeff;
  --text:#000000; --text2:#818c99; --subhead:#626d7a; --text3:#99a2ad;
  --link:#2a5885; --accent:#447bba; --text-neg:#e64646; --text-pos:#4bb34b;
  --icon:#2c2d2e; --icon2:#99a2ad; --icon3:#aeb7c2; --icon-med:#6f7985; --icon-acc:#447bba;
  --sep:#dce1e6; --sep2:#e7e8ec;
  --hover:rgba(0,16,61,.04); --active:rgba(0,16,61,.08); --alpha:rgba(39,63,92,.07);
  --skel-from:rgba(3,11,23,.02); --skel-to:rgba(3,11,23,.1);
  --im-bg:#edeef0; --bubble-in:#ffffff; --bubble-out:#cfe0f5; --im-field:#ffffff; --field-soft:#f0f2f5; --sec-pill:#e6e9ee;
  --a-azure:#3f8ae0; --a-violet:#792ec0; --a-fire:#f05c44; --a-cyan:#7cf4dc;
  --e1:0 0 2px rgba(0,0,0,.06), 0 2px 2px rgba(0,0,0,.08);
  --e2:0 4px 8px rgba(0,0,0,.08), 0 0 4px rgba(0,0,0,.06);
  --e3:0 0 2px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.12);
  --e4:0 0 8px rgba(0,0,0,.06), 0 16px 16px rgba(0,0,0,.10);
  --ease:cubic-bezier(.3,.3,.5,1); --ease-p:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-vk="light"]){
    color-scheme: dark;
    --is-dark:1;
    --bg:#141414; --content:#222222; --secondary:#333333; --tertiary:#292929;
    --modal:#292929; --header:#222222; --field:#292929; --searchfield:#424242;
    --acc:#e1e3e6; --acc-h:#d8dbdf; --acc-a:#cfd2d8; --on-acc:#222222;
    --neg:#ff5c5c; --pos:#4bb34b;
    --neg-tint:#522e2e; --pos-tint:#2f422f; --warn-tint:#473315; --info-tint:#1c3954;
    --text:#e1e3e6; --text2:#828282; --subhead:#939393; --text3:#656565;
    --link:#71aaeb; --accent:#71aaeb; --text-neg:#ff5c5c; --text-pos:#4bb34b;
    --icon:#e1e3e6; --icon2:#828282; --icon3:#656565; --icon-med:#939393; --icon-acc:#71aaeb;
    --sep:#363738; --sep2:#292929;
    --hover:rgba(255,255,255,.04); --active:rgba(255,255,255,.08); --alpha:rgba(255,255,255,.08);
    --skel-from:#292929; --skel-to:#333333;
    --im-bg:#19191a; --bubble-in:#333333; --bubble-out:#1e2f42; --im-field:#292929; --field-soft:#292929; --sec-pill:#323232; --sec-pill:#323232; --field-soft:#292929;
    --a-azure:#5d9ee9; --a-violet:#a94fff; --a-fire:#f05c44; --a-cyan:#55f1d2;
    --e1:0 0 2px rgba(0,0,0,.10), 0 2px 2px rgba(0,0,0,.20);
    --e2:0 4px 8px rgba(0,0,0,.15), 0 0 4px rgba(0,0,0,.20);
    --e3:0 0 2px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.30);
    --e4:0 0 8px rgba(0,0,0,.10), 0 16px 16px rgba(0,0,0,.20);
  }
}
:root[data-vk="dark"]{
  color-scheme: dark;
  --is-dark:1;
  --bg:#141414; --content:#222222; --secondary:#333333; --tertiary:#292929;
  --modal:#292929; --header:#222222; --field:#292929; --searchfield:#424242;
  --acc:#e1e3e6; --acc-h:#d8dbdf; --acc-a:#cfd2d8; --on-acc:#222222;
  --neg:#ff5c5c; --pos:#4bb34b;
  --neg-tint:#522e2e; --pos-tint:#2f422f; --warn-tint:#473315; --info-tint:#1c3954;
  --text:#e1e3e6; --text2:#828282; --subhead:#939393; --text3:#656565;
  --link:#71aaeb; --accent:#71aaeb; --text-neg:#ff5c5c; --text-pos:#4bb34b;
  --icon:#e1e3e6; --icon2:#828282; --icon3:#656565; --icon-med:#939393; --icon-acc:#71aaeb;
  --sep:#363738; --sep2:#292929;
  --hover:rgba(255,255,255,.04); --active:rgba(255,255,255,.08); --alpha:rgba(255,255,255,.08);
  --skel-from:#292929; --skel-to:#333333;
  --im-bg:#19191a; --bubble-in:#333333; --bubble-out:#1e2f42; --im-field:#292929;
  --a-azure:#5d9ee9; --a-violet:#a94fff; --a-fire:#f05c44; --a-cyan:#55f1d2;
  --e1:0 0 2px rgba(0,0,0,.10), 0 2px 2px rgba(0,0,0,.20);
  --e2:0 4px 8px rgba(0,0,0,.15), 0 0 4px rgba(0,0,0,.20);
  --e3:0 0 2px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.30);
  --e4:0 0 8px rgba(0,0,0,.10), 0 16px 16px rgba(0,0,0,.20);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,system-ui,"Helvetica Neue",Roboto,sans-serif;
  font-size:15px;line-height:20px;-webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent);color:var(--on-acc)}

/* ---------- шапка ---------- */
.hdr{
  position:sticky;top:0;z-index:60;height:48px;background:var(--header);
  box-shadow:0 0 0 1px var(--sep2);display:flex;align-items:center;gap:12px;
  padding:0 16px;
}
.hdr .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--text)}
.hdr .logo .mark{
  width:26px;height:26px;border-radius:7px;background:#0077ff;display:grid;place-items:center;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:-.04em;flex:0 0 auto;
}
.search{
  flex:0 1 340px;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;
  background:var(--searchfield);color:var(--text2);font-size:14px;cursor:text;
  transition:background-color .15s ease-out;border:0;width:100%;
}
.search:hover{background:var(--hover),var(--searchfield)}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--accent)}
.search input:focus{outline:none}
.search input::placeholder{color:var(--text2)}
.hdr .grow{flex:1}
.iconbtn{
  position:relative;width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--icon);
  display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:0 0 auto;
  transition:background-color .15s ease-out;
}
.iconbtn:hover{background:var(--hover)}
.iconbtn:active{background:var(--active)}
.badge{
  position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--neg);color:#fff;font-size:11px;font-weight:600;line-height:16px;text-align:center;
  box-shadow:0 0 0 2px var(--header);
}
.proto-tag{
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);
  border:1px solid var(--sep);border-radius:20px;padding:3px 9px;white-space:nowrap;
}

/* ---------- каркас ---------- */
.shell{max-width:1420px;margin:0 auto;padding:16px 12px;display:grid;grid-template-columns:180px minmax(0,1fr) 280px;gap:16px;align-items:start}
@media (max-width:1180px){ .shell{grid-template-columns:180px minmax(0,1fr)} .aside{display:none} }
@media (max-width:760px){ .shell{grid-template-columns:minmax(0,1fr)} .nav{display:none} }

.nav{position:sticky;top:64px;display:flex;flex-direction:column;gap:2px}
.nav a{
  position:relative;display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:8px;
  color:var(--text);font-size:14px;overflow:hidden;transition:background-color .15s ease-out;cursor:pointer;
}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="page"]{background:var(--alpha);font-weight:500}
.nav a svg{color:var(--icon-med);flex:0 0 auto}
.nav a[aria-current="page"] svg{color:var(--icon)}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:600;color:#fff;background:var(--neg);border-radius:9px;padding:0 6px;line-height:18px}
.nav .sep{height:1px;background:var(--sep);margin:10px 0}
.nav .quiet{color:var(--text2);font-size:12.5px;padding:0 10px;line-height:22px}

.card{background:var(--content);border-radius:12px;overflow:hidden}
.card + .card{margin-top:12px}
.pad{padding:14px 16px}
.aside{position:sticky;top:64px;display:flex;flex-direction:column;gap:12px}

/* ---------- типографика VKUI ---------- */
.t-title2{font-size:20px;line-height:24px;font-weight:500}
.t-headline{font-size:16px;line-height:20px;font-weight:500}
.t-text{font-size:16px;line-height:20px}
.t-paragraph{font-size:15px;line-height:20px}
.t-subhead{font-size:14px;line-height:18px}
.t-footnote{font-size:13px;line-height:16px}
.t-caption{font-size:12px;line-height:14px}
.muted{color:var(--text2)}
.dim{color:var(--text3)}

/* ---------- кнопки ---------- */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:8px;padding:0 16px;height:32px;cursor:pointer;overflow:hidden;
  font-size:13.5px;font-weight:500;background:var(--acc);color:var(--on-acc);
  transition:background-color .15s ease-out,color .15s ease-out,opacity .15s ease-out;
}
.btn:hover{background:var(--acc-h)} .btn:active{background:var(--acc-a)}
.btn.sec{background:var(--alpha);color:var(--text)}
.btn.sec:hover{background:var(--hover)}
.btn.ter{background:transparent;color:var(--accent)}
.btn.ter:hover{background:var(--hover)}
.btn.wide{width:100%}
.btn.l{height:36px;font-size:14px}

/* ---------- ripple (vkuiTappable__animationWave) ---------- */
.tap{position:relative;overflow:hidden}
.wave{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;pointer-events:none;
  background:var(--active);animation:wave .3s var(--ease-p) forwards}
@keyframes wave{0%{opacity:1;transform:scale(1)}30%{opacity:1}to{opacity:0;transform:scale(8)}}

/* ---------- аватары ---------- */
.av{border-radius:50%;flex:0 0 auto;background-color:var(--secondary);background-size:cover;
  background-position:center;display:block;position:relative}
.av.sq{border-radius:8px}
.avw{position:relative;flex:0 0 auto}
.on{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--pos);
  box-shadow:0 0 0 3px var(--content)}

/* ---------- посты ---------- */
.post-hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.post-hd .who{font-size:15px;line-height:19px;font-weight:500}
.post-hd .when{font-size:13px;line-height:16px;color:var(--text2);display:flex;align-items:center;gap:5px}
.post-txt{padding:0 16px 12px;font-size:15px;line-height:20px;white-space:pre-wrap;word-break:break-word}
.post-txt .tag{color:var(--link)}
.more-btn{background:none;border:0;color:var(--link);cursor:pointer;font-size:15px;padding:0}
.media{width:100%;aspect-ratio:4/3;background:var(--secondary);display:block;cursor:zoom-in}
.media.tall{aspect-ratio:3/4}
/* реакции и действия поста — прозрачные кнопки h24/r8, как на vk.ru */
.reacts{display:flex;align-items:center;gap:8px;padding:2px 16px 0;font-size:13px;line-height:16px;color:var(--text2)}
.reacts .stack{display:flex}
.reacts .stack span{width:16px;height:16px;border-radius:50%;font-size:10px;display:grid;place-items:center;
  background:var(--secondary);box-shadow:0 0 0 2px var(--content);margin-left:-5px}
.reacts .stack span:first-child{margin-left:0}
.acts{display:flex;align-items:center;gap:4px;padding:8px 12px 12px}
.act{
  position:relative;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:8px;
  border:0;background:transparent;color:var(--text2);font-size:13px;line-height:16px;font-weight:500;
  cursor:pointer;overflow:hidden;transition:background-color .15s ease-out,color .15s ease-out;
}
.act:hover{background:var(--hover);color:var(--text)}
.act.on{color:var(--text-neg)}
.act.on:hover{color:var(--text-neg)}
.act .n{font-variant-numeric:tabular-nums}
.act.when{margin-left:auto;background:transparent;pointer-events:none;color:var(--text3);font-weight:400}

/* вложения */
.attach{margin:0 16px 12px;border-radius:8px;border:1px solid var(--sep);overflow:hidden}
.attach .row{display:flex;align-items:center;gap:12px;padding:10px 12px}
.attach .cover{width:40px;height:40px;border-radius:6px;flex:0 0 auto;background:var(--secondary)}
.attach .lnk{padding:10px 12px;border-top:1px solid var(--sep)}
.playbtn{
  width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto;transition:transform .15s var(--ease);
}
.playbtn:hover{transform:scale(1.06)}

/* комментарии — без «бабблов», как на vk.ru: аватар 28, имя 14/18/500, текст 14/18, мета 13/16 */
.cmts{border-top:1px solid var(--sep2);padding:10px 16px 14px;display:flex;flex-direction:column;gap:14px}
.cmt-sort{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;
  color:var(--text);font-size:14px;line-height:18px;font-weight:500;cursor:pointer}
.cmt-sort svg{color:var(--icon2)}
.cmt{display:flex;gap:10px}
.cav{width:28px;height:28px;border-radius:50%;flex:0 0 auto;background-size:cover;background-color:var(--secondary);display:block}
.cmt .bd{flex:1;min-width:0}
.cmt .nm{display:flex;align-items:center;gap:5px;font-size:14px;line-height:18px;font-weight:500}
.cmt .tx{font-size:14px;line-height:18px;margin-top:1px;word-break:break-word;white-space:pre-wrap}
.cmt .tx.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cmt .showmore{background:none;border:0;padding:0;color:var(--link);font-size:14px;line-height:18px;cursor:pointer}
.cmt .mt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:4px;font-size:13px;line-height:16px;color:var(--text2)}
.cmt .mt > span:first-child{white-space:nowrap}
.viewer .side [data-cshare]{display:none}
.cmt .mt button{background:none;border:0;color:var(--text2);cursor:pointer;font-size:13px;line-height:16px;padding:0}
.cmt .mt button:hover{color:var(--link)}
.cmt .clike{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:0;
  color:var(--text2);font-size:13px;line-height:16px;cursor:pointer;font-variant-numeric:tabular-nums}
.cmt .clike:hover{color:var(--text)}
.cmt .clike.on{color:var(--text-neg)}
.cmt-new{display:flex;gap:10px;align-items:center}
.cmt-new .fld{flex:1;display:flex;align-items:center;gap:4px;height:38px;border-radius:8px;
  background:var(--field-soft);border:1px solid transparent;padding:0 6px 0 12px;
  transition:border-color .15s ease-out}
.cmt-new .fld:focus-within{border-color:var(--accent)}
.cmt-new input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:13px;line-height:18px}
.cmt-new input:focus{outline:none}
.cmt-new input::placeholder{color:var(--text2)}

/* ---------- истории ---------- */
.stories{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{width:94px;flex:0 0 auto;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--text)}
.story .im{width:94px;height:167px;border-radius:12px;position:relative;overflow:hidden;background:var(--secondary);
  transition:transform .2s var(--ease)}
.story:hover .im{transform:translateY(-2px)}
.story .ava{position:absolute;left:8px;top:8px;width:32px;height:32px;border-radius:50%;
  box-shadow:0 0 0 2px var(--a-azure), 0 0 0 4px rgba(0,0,0,.35);background:var(--secondary);background-size:cover}
.story .cap{position:absolute;left:6px;right:6px;bottom:6px;font-size:11px;line-height:14px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story.add .im{display:grid;place-items:center;background:var(--secondary)}
.story.add .plus{width:36px;height:36px;border-radius:50%;background:var(--content);display:grid;place-items:center;color:var(--icon)}

/* ---------- профиль (значения с vk.ru) ---------- */
.cover{height:200px;position:relative;background-size:130% 130%;background-position:center;
  background-color:var(--secondary)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.45))}
.prof{position:relative;background:var(--content);padding:8px 16px 14px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.prof .avwrap{margin-top:-84px;flex:0 0 auto;position:relative}
.prof .big{width:130px;height:130px;border-radius:50%;box-shadow:0 0 0 4px var(--content);background-size:cover;
  background-color:var(--secondary);display:block}
.prof .plusb{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;border:0;
  background:var(--a-azure);color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 0 0 3px var(--content)}
.prof .info{flex:1 1 220px;padding-bottom:2px;min-width:0}
.prof .nm{font-size:22px;line-height:24px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof .nm .emo{font-size:22px;line-height:24px}
.prof .st{display:inline-flex;align-items:center;gap:4px;color:var(--link);font-size:13px;line-height:16px;margin-top:8px;cursor:pointer}
.pacts{display:flex;gap:8px;align-items:center;padding-bottom:2px;flex-wrap:wrap}

.tabs{display:flex;gap:4px;padding:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  border:0;background:transparent;color:var(--text2);font-size:14px;font-weight:500;
  padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;position:relative;overflow:hidden;
  transition:background-color .15s ease-out,color .15s ease-out;
}
.tabs button:hover{background:var(--hover);color:var(--text)}
.tabs button[aria-selected="true"]{background:var(--alpha);color:var(--text)}

/* альбомы-обложки и треки в две колонки — как на странице профиля */
.albstrip{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.albstrip::-webkit-scrollbar{display:none}
.albstrip .a{width:104px;flex:0 0 auto;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--text)}
.albstrip .a .im{display:block;width:104px;height:104px;border-radius:8px;background:var(--secondary);
  transition:transform .2s var(--ease)}
.albstrip .a:hover .im{transform:translateY(-2px)}
.albstrip .a .cap{display:block;font-size:13px;line-height:16px;margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trk2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0 8px;padding:0 8px}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gifts span{aspect-ratio:1;border-radius:8px;background:var(--secondary);background-size:cover}
.createpost{display:flex;align-items:center;gap:10px;padding:10px 16px}
.createpost .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:36px;
  border-radius:8px;border:0;background:var(--alpha);color:var(--text);font-size:14px;font-weight:500;
  cursor:pointer;position:relative;overflow:hidden;transition:background-color .15s ease-out}
.createpost .mid:hover{background:var(--hover)}
.emptybox{padding:26px 16px;text-align:center;color:var(--text2);font-size:13px;line-height:18px}

.trk{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer;position:relative;overflow:hidden;
  transition:background-color .15s ease-out}
.trk:hover{background:var(--hover)}

function el(h){ var d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
function ex(c){ // #abc -> #aabbcc
  if(c.length===4) return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  return c;
}
/* карта цветов -> мягкий меш-градиент, похожий на исходное фото */
function mesh(map, n){
  var cols = map.trim().split(/\s+/).map(ex);
  n = n || Math.round(Math.sqrt(cols.length));
  var r = Math.round(150/n);
  var layers = cols.map(function(c,i){
    var x = ((i%n)+0.5)/n*100, y = (Math.floor(i/n)+0.5)/n*100;
    return 'radial-gradient(circle at '+x.toFixed(1)+'% '+y.toFixed(1)+'%, '+c+' 0%, '+c+'00 '+r+'%)';
  });
  var base = cols[Math.floor(cols.length/2)];
  return layers.join(',')+',linear-gradient('+base+','+base+')';
}
function bg(map,n){ return 'background-image:'+mesh(map,n)+';background-size:cover'; }

/* ripple */
document.addEventListener('pointerdown', function(e){
  var h = e.target.closest('.tap,.nav a,.btn,.act,.chip,.convo,.trk,.tabs button,.counters button');
  if(!h) return;
  if(getComputedStyle(h).position === 'static') h.style.position='relative';
  h.style.overflow='hidden';
  var r = h.getBoundingClientRect();
  var w = document.createElement('span');
  w.className='wave'; w.style.left=(e.clientX-r.left)+'px'; w.style.top=(e.clientY-r.top)+'px';
  h.appendChild(w); setTimeout(function(){ w.remove(); },330);
});

/* снекбар */
function snack(text){
  var s = el('<div class="snack"><span class="ic">'+icon('check',14)+'</span><span>'+esc(text)+'</span></div>');
  document.getElementById('snacks').appendChild(s);
  setTimeout(function(){ s.style.transition='opacity .2s, transform .2s'; s.style.opacity='0'; s.style.transform='translateY(20px)';
    setTimeout(function(){ s.remove(); },220); }, 2200);
}

/* =============== тема =============== */
var root = document.documentElement;
function currentTheme(){
  var a = root.getAttribute('data-vk');
  if(a) return a;
  // matchMedia внутри фрейма врёт — спрашиваем сам CSS
  return getComputedStyle(root).getPropertyValue('--is-dark').trim() === '1' ? 'dark' : 'light';
}
function setTheme(t, persist){
  root.setAttribute('data-vk', t);
  if(persist){ try{ localStorage.setItem('vkproto-theme', t); }catch(e){} }
  document.getElementById('themeBtn').innerHTML = icon(t==='dark' ? 'sun' : 'moon', 20);
}
document.getElementById('themeBtn').addEventListener('click', function(){
  setTheme(currentTheme()==='dark' ? 'light' : 'dark', true);
});
(function(){
  var t = null;
  try{ t = localStorage.getItem('vkproto-theme'); }catch(e){}
  // тема зрителя — по умолчанию; в хранилище попадает только явный выбор
  setTheme(t === 'light' || t === 'dark' ? t : currentTheme(), false);
})();

/* =============== плеер =============== */
var P = { i:0, playing:false, t:0, len:0, timer:null };
function parseDur(d){ var p=d.split(':'); return (+p[0])*60 + (+p[1]); }
function fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function renderPlayer(){
  var tr = TRACKS[P.i];
  document.getElementById('pT1').textContent = tr.t;
  document.getElementById('pT2').textContent = tr.a;
  document.getElementById('pDur').textContent = tr.d;
  document.getElementById('pCur').textContent = fmt(P.t);
  document.querySelector('#pBar i').style.width = (P.len ? P.t/P.len*100 : 0)+'%';
  document.getElementById('pPlay').innerHTML = icon(P.playing?'pause':'play',16);
  document.getElementById('hplayer').classList.add('up');
  document.querySelectorAll('[data-track]').forEach(function(n){
    n.setAttribute('aria-current', String(+n.dataset.track === P.i && P.playing));
    var eqn = n.querySelector('.eqslot');
    if(eqn) eqn.innerHTML = (+n.dataset.track===P.i && P.playing) ? '<span class="eq"><i></i><i></i><i></i><i></i></span>' : '';
  });
}
function play(i){
  if(i!=null && i!==P.i){ P.i=i; P.t=0; }
  P.len = parseDur(TRACKS[P.i].d);
  P.playing = true;
  clearInterval(P.timer);
  P.timer = setInterval(function(){
    P.t += 1;
    if(P.t >= P.len){ next(); return; }
    document.getElementById('pCur').textContent = fmt(P.t);
    document.querySelector('#pBar i').style.width = (P.t/P.len*100)+'%';
  }, 1000);
  renderPlayer();
}
function toggle(){ if(P.playing){ P.playing=false; clearInterval(P.timer); renderPlayer(); } else play(); }
function next(){ P.i = (P.i+1)%TRACKS.length; P.t=0; play(); }
function prev(){ P.i = (P.i-1+TRACKS.length)%TRACKS.length; P.t=0; play(); }
document.getElementById('pPlay').addEventListener('click', toggle);
document.getElementById('pNext').addEventListener('click', next);
document.getElementById('pPrev').addEventListener('click', prev);
document.getElementById('pBar').addEventListener('click', function(e){
  var r=this.getBoundingClientRect(); P.t = Math.round((e.clientX-r.left)/r.width*P.len);
  document.getElementById('pCur').textContent = fmt(P.t);
  this.querySelector('i').style.width=((e.clientX-r.left)/r.width*100)+'%';
});

/* =============== посты =============== */
var likeState = {}, cmtState = {};
function postHTML(p, opts){
  opts = opts || {};
  var who = opts.who || ME.name;
  var av  = opts.av  || AV;
  var avn = opts.av ? 2 : 10;
  var liked = !!likeState[p.id];
  var extra = (p.comments||[]).length + (cmtState[p.id]||[]).length;
  var body = '';

  if(p.head) body += '<div class="post-txt" style="padding-bottom:4px"><b>'+esc(p.head)+'</b></div>';
  body += '<div class="post-txt" data-clamp>'+linkify(p.text)+'</div>';

  if(p.media){
    body += '<div class="media'+(p.media.tall?' tall':'')+'" style="'+bg(p.media.m,4)+'" data-photo="'+esc(p.id)+'"></div>';
  }
  if(p.gallery){
    body += '<div class="media" style="'+bg(p.gallery.m,2)+';position:relative" data-photo="'+esc(p.id)+'">'+
      '<span style="position:absolute;top:10px;right:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:12px;padding:2px 9px;font-size:12px">1/'+p.gallery.count+'</span></div>';
  }
  if(p.audio){
    body += '<div class="attach"><div class="row">'+
      '<span class="cover" style="'+bg(p.audio.cv,2)+'"></span>'+
      '<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:500">'+esc(p.audio.t)+'</span>'+
      '<span style="display:block;font-size:13px;color:var(--text2)">'+esc(p.audio.a)+'</span></span>'+
      '<span class="dim" style="font-size:12.5px">'+esc(p.audio.dur)+'</span>'+
      '<button class="playbtn tap" data-audio aria-label="Слушать">'+icon('play',16)+'</button>'+
      '</div></div>';
  }
  if(p.link){
    body += '<div class="attach"><div class="row">'+
      '<span class="cover" style="'+bg(p.link.cv,2)+'"></span>'+
      '<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:500">'+esc(p.link.t)+'</span>'+
      '<span style="display:block;font-size:13px;color:var(--text2)">'+esc(p.link.s)+'</span></span></span>'+
      '</div><div class="lnk t-footnote muted">'+esc(p.link.d)+' · <a href="#/feed">Перейти</a></div></div>';
  }

  var totalLikes = p.likes + (liked?1:0);
  return '<article class="card" data-post="'+esc(p.id)+'">'+
    '<div class="post-hd">'+
      '<span class="av" style="'+bg(av,avn)+';width:40px;height:40px"></span>'+
      '<span style="flex:1;min-width:0"><span class="who">'+esc(who)+'</span>'+
      (p.pinned?'<span class="when">📌 запись закреплена</span>':'')+'</span>'+
      (opts.sub===true ? '<button class="btn sec tap" data-sub>Подписаться</button>' : '')+
    '</div>'+
    body+
    (totalLikes>=20 ? '<div class="reacts"><span class="stack"><span>❤</span><span>🔥</span><span>👍</span></span>'+
      '<span>Оценили '+totalLikes+' человек</span></div>' : '')+
    '<div class="acts">'+
      '<button class="act tap'+(liked?' on':'')+'" data-like>'+icon('like',16)+'<span class="n">'+(totalLikes>=20?(liked?'Вы оценили':'Лайк'):totalLikes)+'</span></button>'+
      '<button class="act tap" data-cmt>'+icon('cmt',16)+'<span class="n">'+(p.cmts+(cmtState[p.id]||[]).length)+'</span></button>'+
      '<button class="act tap" data-share>'+icon('share',16)+(p.reposts?'<span class="n">'+p.reposts+'</span>':'')+'</button>'+
      '<span class="act when">'+esc(p.when)+'</span>'+
    '</div>'+
    '<div class="cmts" hidden data-cmts></div>'+
  '</article>';
}
function linkify(t){
  return esc(t)
    .replace(/(#[\wА-Яа-яЁё_]+)/g,'<span class="tag">$1</span>')
    .replace(/(band\.link\/[\w.\-_]+)/g,'<a href="#/feed">$1</a>');
}
function findPost(id){
  var all = FEED.concat(WALL);
  for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i];
  return null;
}

  var long = c.t.length > 220;

function sendMsg(){
  var inp = document.getElementById('msgInput');
  var v = inp.value.trim(); if(!v) return;
  var c = CONVOS.filter(function(x){return x.id===curConvo})[0];
  var now = new Date(), tm = now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  convoMsgs[c.id].push({me:true,t:v,tm:tm});
  inp.value=''; renderChat();
  var box = document.getElementById('msgs');
  var REPLY = { c3:'а вот и нет', c4:'ыфвафыв', c5:null, c1:null, c2:null };
  var r = REPLY[c.id];
  if(!r) return;
  var typing = el('<div class="typing"><i></i><i></i><i></i></div>');
  box.appendChild(typing); box.scrollTop = box.scrollHeight;
  setTimeout(function(){
    typing.remove();
    convoMsgs[c.id].push({me:false,t:r,tm:tm});
    renderChat();
  }, 1400);
}

      '<button class="nav-b l tap" data-pv>'+icon('left',20)+'</button>'+
      '<button class="nav-b r tap" data-nx>'+icon('right',20)+'</button>'+
      '<button class="closex tap" data-close>'+icon('close',16)+'</button></div>'+
      '<div class="side"><div class="top"><span class="av" style="'+bg(AV,10)+';width:36px;height:36px"></span>'+
      '<span><span style="display:block;font-size:14px;font-weight:500">'+esc(ME.name)+'</span>'+
      '<span class="t-footnote muted">'+esc(p.t)+' · '+(i+1)+' из '+PHOTOS.length+'</span></span></div>'+
      '<div class="body">'+
        (p.comments.length ? p.comments.map(function(c,ci){
          return commentHTML(c, 'ph'+i+'_'+ci, ci);
        }).join('') : '<div class="muted t-footnote">Комментариев пока нет — напишите первый</div>')+
      '</div>'+
      '<div class="foot"><div style="display:flex;gap:4px;margin-bottom:10px">'+
        '<button class="act tap'+(liked?' on':'')+'" data-phlike>'+icon('like',16)+'<span class="n">'+(p.likes+(liked?1:0))+'</span></button>'+
        '<button class="act tap">'+icon('share',16)+'</button></div>'+
      '<div class="cmt-new"><span class="cav" style="'+bg(AV,10)+'"></span>'+
      '<span class="fld"><input placeholder="Написать комментарий…" data-phc>'+
      '<button class="cbtn tap" aria-label="Смайлы">'+icon('smile',18)+'</button></span>'+
      '<button class="iconbtn tap" data-phsend aria-label="Отправить">'+icon('send',20)+'</button></div></div>'+
      '</div>';
  }
  draw();
  scrim.addEventListener('click', function(e){
    if(e.target===scrim || e.target.closest('[data-close]')) { scrim.remove(); return; }
    if(e.target.closest('[data-nx]')){ i=(i+1)%PHOTOS.length; draw(); }
    if(e.target.closest('[data-pv]')){ i=(i-1+PHOTOS.length)%PHOTOS.length; draw(); }
    if(e.target.closest('[data-phlike]')){ likeState['ph'+i]=!likeState['ph'+i]; draw(); }
    if(e.target.closest('[data-clike]')){
      var ck2 = e.target.closest('[data-c]').dataset.c;
      cLikeState[ck2] = !cLikeState[ck2]; draw();
    }
    if(e.target.closest('[data-showmore]')){
      var sm2 = e.target.closest('[data-showmore]');
      sm2.previousElementSibling.classList.remove('clamp'); sm2.remove();
    }
    if(e.target.closest('[data-phsend]')){
      var inp = v.querySelector('[data-phc]'); var t=inp.value.trim(); if(!t) return;
      PHOTOS[i].comments.push({n:ME.name, t:t}); draw(); snack('Комментарий добавлен');
    }
  });
  scrim.addEventListener('keydown', function(e){ if(e.key==='Escape') scrim.remove(); });
  document.addEventListener('keydown', function esc2(e){
    if(e.key==='Escape'){ scrim.remove(); document.removeEventListener('keydown',esc2); }
  });
}

function openStory(i){
  var scrim = el('<div class="scrim"><div class="stview"></div></div>');
  document.body.appendChild(scrim);
  var v = scrim.querySelector('.stview');
  var timer;
  function draw(){
    var s = STORIES[i];
    v.innerHTML = '<div class="im" style="'+bg(s.m,4)+'"></div>'+
      '<div class="bars">'+STORIES.map(function(_,k){
        return '<i><b style="width:'+(k<i?100:0)+'%"></b></i>';
      }).join('')+'</div>'+
      '<div class="who"><span class="av" style="'+bg(s.m,2)+';width:32px;height:32px;box-shadow:0 0 0 2px #fff"></span>'+
      '<span style="font-size:14px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.7)">'+esc(s.n)+'</span>'+
      '<button class="closex tap" style="position:static;margin-left:auto" data-close>'+icon('close',16)+'</button></div>'+
      '<div class="cap">'+esc(s.cap)+'</div>';
    var bar = v.querySelectorAll('.bars b')[i];
    var t0 = Date.now(), DUR = 4000;
    clearInterval(timer);
    timer = setInterval(function(){
      var p = (Date.now()-t0)/DUR;
      if(p>=1){ if(i<STORIES.length-1){ i++; draw(); } else { clearInterval(timer); scrim.remove(); } return; }
      bar.style.width = (p*100)+'%';
    }, 40);
  }
  draw();
  scrim.addEventListener('click', function(e){
    if(e.target.closest('[data-close]') || e.target===scrim){ clearInterval(timer); scrim.remove(); return; }
    var r = v.getBoundingClientRect();
    if(e.clientX - r.left < r.width*0.35){ if(i>0){ i--; draw(); } }
    else { if(i<STORIES.length-1){ i++; draw(); } else { clearInterval(timer); scrim.remove(); } }
  });
  document.addEventListener('keydown', function esc3(e){
    if(e.key==='Escape'){ clearInterval(timer); scrim.remove(); document.removeEventListener('keydown',esc3); }
  });
}

function route(){

  if(!SCREENS[r]) r='feed';
  renderNav(r);
  var main = document.getElementById('main');
  main.innerHTML = skeleton(r);
  document.getElementById('aside').innerHTML = aside(r);
  setTimeout(function(){
    main.innerHTML = SCREENS[r]();
    if(r==='profile') document.getElementById('ptabBody').innerHTML = ptabBody(0);

    renderPlayer();

/* =============== делегирование событий =============== */
document.addEventListener('click', function(e){
  var t = e.target;

  var story = t.closest('[data-story]');
  if(story){ openStory(+story.dataset.story); return; }

  var ph = t.closest('[data-ph]');
  if(ph){ openPhoto(+ph.dataset.ph); return; }

  var pm = t.closest('[data-photo]');
  if(pm){ openPhoto(0); return; }

  var tr = t.closest('[data-track]');
  if(tr){ play(+tr.dataset.track);
    var a1=document.getElementById('asideT1');
    if(a1){ a1.textContent=TRACKS[P.i].t; document.getElementById('asideT2').textContent=TRACKS[P.i].a;
      document.getElementById('asideCv').setAttribute('style', bg(TRACKS[P.i].cv,2)); }
    return; }

  var au = t.closest('[data-audio]');
  if(au){ play(P.i); snack('Играет: '+TRACKS[P.i].t); return; }

  var go = t.closest('[data-go]');
  if(go){ location.hash = '#/'+go.dataset.go; return; }

  var ptab = t.closest('[data-ptab]');
  if(ptab){
    document.querySelectorAll('[data-ptab]').forEach(function(b){ b.setAttribute('aria-selected', String(b===ptab)); });
    document.getElementById('ptabBody').innerHTML = ptabBody(+ptab.dataset.ptab);
    return;
  }

  var art = t.closest('[data-post]');
  if(art){
    if(t.closest('[data-clike]')){
      var cel = t.closest('[data-c]'); var ck = cel.dataset.c;
      cLikeState[ck] = !cLikeState[ck];
      var cb = cel.querySelector('[data-clike]');
      var base = 0, pp = findPost(art.dataset.post);
      var all = (pp.comments||[]).concat(cmtState[art.dataset.post]||[]);
      var ix = +ck.split('_').pop(); base = (all[ix] && all[ix].likes) || 0;
      var tot = base + (cLikeState[ck]?1:0);
      cb.classList.toggle('on', cLikeState[ck]);
      cb.innerHTML = icon('like',14) + (tot?'<span>'+tot+'</span>':'');
      return;
    }
    if(t.closest('[data-showmore]')){
      var sm = t.closest('[data-showmore]');
      sm.previousElementSibling.classList.remove('clamp'); sm.remove(); return;
    }
    if(t.closest('[data-reply]')){
      var inp0 = art.querySelector('[data-cmt-input]');
      if(inp0){ inp0.value = t.closest('[data-c]').querySelector('.nm').textContent.trim()+', '; inp0.focus(); }
      return;
    }
    if(t.closest('[data-cshare]')){ snack('Ссылка на комментарий скопирована'); return; }
    if(t.closest('[data-like]')){
      var id = art.dataset.post; likeState[id] = !likeState[id];
      var b = art.querySelector('[data-like]'), p = findPost(id);
      b.classList.toggle('on', likeState[id]);
      var tot2 = p.likes + (likeState[id]?1:0);
      b.querySelector('.n').textContent = tot2>=20 ? (likeState[id]?'Вы оценили':'Лайк') : tot2;
      var rr = art.querySelector('.reacts span:last-child');
      if(rr) rr.textContent = 'Оценили '+tot2+' человек';
      return;
    }
    if(t.closest('[data-cmt]')){
      var box = art.querySelector('[data-cmts]');
      if(box.hidden){ renderComments(art); box.hidden=false; } else box.hidden=true;
      return;
    }
    if(t.closest('[data-share]')){ snack('Ссылка скопирована'); return; }
    if(t.closest('[data-sub]')){
      var btn = t.closest('[data-sub]');
      btn.textContent = btn.textContent==='Подписаться' ? 'Вы подписаны' : 'Подписаться';
      snack(btn.textContent==='Вы подписаны' ? 'Подписка оформлена' : 'Подписка отменена'); return;
    }
    if(t.closest('[data-cmt-send]')){
      var inp = art.querySelector('[data-cmt-input]'); var v = inp.value.trim(); if(!v) return;
      var pid = art.dataset.post;
      (cmtState[pid] = cmtState[pid] || []).push({n:ME.name, t:v});
      renderComments(art); snack('Комментарий добавлен'); return;
    }
  }

  var cv = t.closest('[data-convo]');
  if(cv){
    var sp = document.getElementById('imSearch');
    if(sp && !sp.hidden) setSearch(false);
    curConvo = cv.dataset.convo;
    document.getElementById('imWrap').classList.add('chat-open');
    renderChat(); return;
  }
  if(t.closest('#msgSend')){
    var mi2 = document.getElementById('msgInput');
    if(mi2 && !mi2.value.trim()){ snack('Запись голосового сообщения — не в этом прототипе'); return; }
    sendMsg(); return;
  }

  if(t.closest('#imList .search')){ setSearch(true); return; }
  if(t.closest('#searchBack')){ setSearch(false); return; }
  var stab = t.closest('[data-stab]');
  if(stab){
    stab.parentElement.querySelectorAll('[data-stab]').forEach(function(x){ x.setAttribute('aria-selected', String(x===stab)); });
    searchTab = +stab.dataset.stab;
    var q0 = (document.getElementById('imSearchInput')||{}).value || '';
    searchBody(q0);
    return;
  }

  var sw = t.closest('.sw-toggle');
  if(sw){ sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked')!=='true')); return; }

  var flt = t.closest('.filter');
  if(flt){
    flt.parentElement.querySelectorAll('.filter').forEach(function(f){ f.setAttribute('aria-pressed', String(f===flt)); });
    return;
  }

  if(t.closest('#searchBtn')){ snack('Поиск в прототипе не подключён'); return; }
  if(t.closest('#notifBtn')){ location.hash='#/im'; return; }
  if(t.closest('#meBtn')){ location.hash='#/profile'; return; }
});

document.addEventListener('input', function(e){
  if(e.target && e.target.id==='imSearchInput') searchBody(e.target.value);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && document.getElementById('imSearch') && !document.getElementById('imSearch').hidden){ setSearch(false); return; }
  if(e.key==='Enter'){
    if(e.target.id==='msgInput'){ sendMsg(); }
    if(e.target.matches('[data-cmt-input]')){
      var art = e.target.closest('[data-post]');
      var v = e.target.value.trim(); if(!v) return;
      var pid = art.dataset.post;
      (cmtState[pid] = cmtState[pid] || []).push({n:ME.name, t:v});
      renderComments(art); snack('Комментарий добавлен');
    }
    if(e.target.matches('[data-phc]')){
      var sc = e.target.closest('.scrim');
      sc.querySelector('[data-phsend]').click();
    }
  }
});

/* старт */
document.getElementById('hdrAv').setAttribute('style', bg(AV,10)+';width:28px;height:28px');
P.i = 0; P.len = parseDur(TRACKS[0].d);
renderPlayer(); P.playing=false; renderPlayer();
route();
})();
